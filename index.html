<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

 <article class="card">

  <img class="card__thumbnail" src="./assets/images/illustration-article.svg" alt="">

  <p class="card__category">Learning</p>

  <time class="card__date" datetime="2023-12-21">Published 21 Dec 2023</time>

  <h1 class="card__title">HTML &amp; CSS foundations</h1>

  <p class="card__description">
    These languages are the backbone of every website, defining structure, content, and presentation.
  </p>

  <div class="card__author">
    <img class="card__avatar" src="./assets/images/image-avatar.webp" alt="Greg Hooper">
    <span class="card__author-name">Greg Hooper</span>
  </div>

  </article>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
